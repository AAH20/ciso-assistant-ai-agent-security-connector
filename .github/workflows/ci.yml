name: Connector Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m ca_agent_connector.cli examples/agentready-result.json --output import-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-ciso-assistant-import-plan
          path: import-plan.json
